name: Crowdin Upload

permissions:
  issues: write
  checks: write
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - beta
      - main
    paths:
      - "src/main/resources/assets/inventorysorter/lang/en_us.json"

jobs:
  crowdin:
    runs-on: meza-ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Crowdin push
        uses: crowdin/github-action@d651c77756acbe11a31d77a6fb79d8a239e1e05a # v3.6.0
        with:
          upload_sources: true
          upload_translations: false
          download_translations: false
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
